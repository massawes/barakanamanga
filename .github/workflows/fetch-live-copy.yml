name: Fetch live copy (InfinityFree -> VPS move)

# Manual only. Copies the live database (through a temporary PHP file that is deleted again)
# and uploads/ + config/ai.php by FTP. Kept as a private artifact for 1 day: delete it after use.
on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: .github
      - name: Install lftp
        run: sudo apt-get -qq update && sudo apt-get -qq install -y lftp
      - name: Copy database
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          KEY=$(openssl rand -hex 24); NAME="_vpsmove_$(openssl rand -hex 8).php"
          echo "::add-mask::$KEY"
          sed "s/__KEY__/$KEY/" .github/vps-move/dump.php > "$NAME"
          FTP="lftp -u ${{ vars.FTP_USERNAME }},$FTP_PASS ${{ vars.FTP_SERVER }}"
          $FTP -e "set ftp:ssl-allow no; put $NAME -o /htdocs/$NAME; bye"
          trap '$FTP -e "set ftp:ssl-allow no; rm -f /htdocs/$NAME; bye"; echo removed temp file' EXIT
          U="https://namangawebsite.freepage.cc/$NAME?k=$KEY"
          curl -s -A "Mozilla/5.0" "$U" -o p1.html
          a=$(grep -o 'a=toNumbers("[0-9a-f]*")' p1.html | grep -o '[0-9a-f]\{32\}')
          b=$(grep -o 'b=toNumbers("[0-9a-f]*")' p1.html | grep -o '[0-9a-f]\{32\}')
          c=$(grep -o 'c=toNumbers("[0-9a-f]*")' p1.html | grep -o '[0-9a-f]\{32\}')
          CK=$(php -r 'echo bin2hex(openssl_decrypt(hex2bin($argv[3]),"aes-128-cbc",hex2bin($argv[1]),OPENSSL_RAW_DATA|OPENSSL_ZERO_PADDING,hex2bin($argv[2])));' $a $b $c)
          mkdir -p copy
          curl -s -m 600 -A "Mozilla/5.0" -b "__test=$CK" "$U&i=1" -o copy/website_db.sql
          tail -1 copy/website_db.sql | grep -q "END OF COPY" || { echo "dump incomplete"; tail -c 500 copy/website_db.sql; exit 1; }
          grep -- "^-- .*rows$" copy/website_db.sql
      - name: Copy uploads and AI config
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "${{ vars.FTP_USERNAME }},$FTP_PASS" "${{ vars.FTP_SERVER }}" -e "
            set ftp:ssl-allow no; set net:max-retries 5; set net:timeout 60;
            mirror --parallel=4 /htdocs/uploads copy/uploads;
            get -e /htdocs/config/ai.php -o copy/ai.php;
            bye" || true
          echo "files: $(find copy/uploads -type f | wc -l)  size: $(du -sh copy/uploads | cut -f1)"
          test -s copy/website_db.sql
          tar czf live-copy.tgz -C copy .
      - uses: actions/upload-artifact@v4
        with:
          name: live-copy
          path: live-copy.tgz
          retention-days: 1
