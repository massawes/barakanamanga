; Same "no upload limit" policy as the project's .htaccess (which only
; applies under mod_php's php_value; set here so it always holds).
upload_max_filesize = 100G
post_max_size = 0
memory_limit = -1
max_execution_time = 0
max_input_time = -1
max_file_uploads = 1000

display_errors = Off
log_errors = On
expose_php = Off
date.timezone = Africa/Dar_es_Salaam
